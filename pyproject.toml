[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychophysics-lab"
version = "0.1.0"
description = "PsyCoLab — Psychophysics Collaborative Lab"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pyglet==1.5.27",
    "textual>=1,<9",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8,<4",
]
dev = [
    "pytest>=8,<9",
    "matplotlib>=3.8,<4",
]

[project.scripts]
psycolab = "psychophysics_lab.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
