<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#080808"/><text x="25" y="38" font-size="26" fill="#eeeeee" font-family="Consolas, monospace">A · Existing console, clearer hierarchy</text><text x="25" y="73" font-size="18" fill="#bbbbbb" font-family="Consolas, monospace">Conservative: keep sidebar, readable table, full selected-row detail. Implemented scope.</text><text x="25" y="105" font-size="17" fill="#bbbbbb" font-family="Consolas, monospace">Faithful design mockup · same declared CSF science · not native or human acceptance</text><rect x="20" y="130" width="235" height="700" fill="#101010" stroke="#555555"/><text x="35" y="167" font-size="19" fill="#eeeeee" font-family="Consolas, monospace">   Experiment</text><text x="35" y="212" font-size="19" fill="#eeeeee" font-family="Consolas, monospace">     Configure</text><text x="35" y="257" font-size="19" fill="#eeeeee" font-family="Consolas, monospace">-&gt;   Review</text><text x="35" y="302" font-size="19" fill="#eeeeee" font-family="Consolas, monospace">   Build Stimuli</text><text x="35" y="347" font-size="19" fill="#eeeeee" font-family="Consolas, monospace">   Build Experiments</text><text x="35" y="392" font-size="19" fill="#eeeeee" font-family="Consolas, monospace">   Calibration</text><text x="35" y="437" font-size="19" fill="#eeeeee" font-family="Consolas, monospace">   Data</text><text x="35" y="482" font-size="19" fill="#eeeeee" font-family="Consolas, monospace">   Learn / Help</text><text x="35" y="527" font-size="19" fill="#eeeeee" font-family="Consolas, monospace">   Refresh / F5</text><text x="280" y="160" font-size="24" fill="#eeeeee" font-family="Consolas, monospace">GAUSSIAN CSF / REVIEW</text><text x="280" y="196" font-size="18" fill="#bbbbbb" font-family="Consolas, monospace">Configure: universal setup   &gt;   Review: scientific inputs and effective plan</text><text x="280" y="236" font-size="18" fill="#eeeeee" font-