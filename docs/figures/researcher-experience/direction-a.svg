o competing parameter store.</text><text x="280" y="803" font-size="17" fill="#d1b875" font-family="Consolas, monospace">Software Test -&gt; Ready is distinct from display / apparatus qualification.</text><text x="25" y="872" font-size="17" fill="#bbbbbb" font-family="Consolas, monospace">Tab / Shift+Tab: controls     F5: refresh saved files     F6: navigation     Esc: back</text></svg>
