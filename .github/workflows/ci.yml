name: Headless checks

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Only the latest commit on a repair PR needs an expensive full Windows run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        # Headless source regression may use the hosted Python distribution;
        # exact conda-forge installer qualification runs separately on Windows 11.
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/windows-cp311/build.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements/windows-cp311/development.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run headless tests
        run: python -X faulthandler -u -m pytest -vv -o faulthandler_timeout=30 -o log_cli=true -o log_cli_level=WARNING
      - name: Launcher diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^(python|cmd|powershell|PsyCoLab-launch.*)\.exe$' } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
          Get-ChildItem -LiteralPath $env:TEMP -Filter 'PsyCoLab-launch-*.exe.log' | ForEach-Object { Write-Output $_.FullName; Get-Content -LiteralPath $_.FullName -Tail 15 }
      - name: Check portability
        run: python scripts/portability_check.py
