name: Headless checks

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Only the latest commit on a repair PR needs an expensive full Windows run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scientist-first-smoke:
    name: Atomic experiment scientific smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/windows-cp311/build.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements/windows-cp311/development.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check live experiment/stimulus contracts and historical pixel oracle
        run: |
          python -m pytest -q -x tests/test_atomic_configuration_migration.py tests/test_atomic_stimulus_parity.py tests/test_scientist_first_stimulus_mapping.py tests/test_modular_ellipse_layers.py tests/test_viewport_clipping.py tests/test_shared_contrast_methods.py tests/test_universal_probe_contrast.py tests/test_stage_b_event_first.py::test_scientific_function_bodies_are_unchanged_and_trial_definition_is_unique tests/test_stage_c_event_first.py::test_scientific_function_bodies_and_approved_authoring_contract tests/test_issue165_wave4.py::test_effective_review_plans_and_all_declared_contracts tests/test_issue165_wave5.py::test_effective_review_plans_and_all_declared_contracts
          python -m pytest -q -x 'tests/test_issue165_wave4.py::test_frozen_complete_trials_and_every_scientific_observation[False-line_position_baseline-adaptive-0]' 'tests/test_issue165_wave4.py::test_frozen_complete_trials_and_every_scientific_observation[False-line_position_flanker-constant_stimuli-0]' 'tests/test_issue165_wave5.py::test_frozen_complete_trials_and_every_scientific_observation[False-ellipse_centre-adaptive-0]' 'tests/test_issue165_wave5.py::test_frozen_complete_trials_and_every_scientific_observation[False-ellipse_major_axis-constant_stimuli-0]'
          python -m pytest -q tests/test_authoring_standard.py::test_shared_scientific_execution_and_frozen_evidence_are_unchanged tests/test_bounded_probe_and_units.py::test_line_cues_are_optional_explicit_and_do_not_encode_answer tests/test_event_first_baseline.py::test_complete_scientific_trace_is_identical_without_new_feature tests/test_experiment_parameter_visibility.py::test_ellipse_geometry_uses_researcher_selected_radius_and_vertical_centre tests/test_geometry_and_parameter_files.py::test_review_uses_actual_trial_overrides_and_keeps_base_inputs_editable tests/test_legacy_flanker_migration.py::test_supported_flanker_trial_phase_order_and_response_mapping tests/test_review_selected_method_accuracy.py::test_fixed_centre_headroom_matches_actual_method_on_selected_display tests/test_scientific_execution_audit.py::test_modern_first_reversal_matches_presented_visual_strength_and_primary_result tests/test_scientific_execution_audit.py::test_actual_prepare_keeps_requested_target_near_off_axis_aperture_edge tests/test_stage_b_event_first.py::test_review_and_acquisition_read_the_same_python_event_function tests/test_tui_refresh.py::test_real_fresh_interpreter_reads_changed_python_and_reports_syntax_error tests/test_issue165_wave4.py::test_completion_ceiling_and_interruptions tests/test_issue165_wave5.py::test_completion_ceiling_and_interruptions tests/test_stage_c_event_first.py::test_defaults_response_meanings_and_safeguards_do_not_drift

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        shard: [0, 1, 2, 3]
    runs-on: ${{ matrix.os }}
    # Bound hangs externally without a background Python stack-dump thread.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Compile Python source and test modules
        run: python -m compileall -q src tests simulations scripts
      - name: Install development dependencies
        # Headless source regression may use the hosted Python distribution;
        # exact conda-forge installer qualification runs separately on Windows 11.
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements/windows-cp311/build.lock
          python -m pip install --require-hashes --only-binary=:all: -r requirements/windows-cp311/development.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Collect all tests before lengthy scientific regression
        run: python -m pytest --collect-only -q
      - name: Run headless tests (full-suite shard ${{ matrix.shard }})
        run: python -u scripts/ci_test_shard.py ${{ matrix.shard }}
      - name: Launcher diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^(python|cmd|powershell|PsyCoLab-launch.*)\.exe$' } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
          Get-ChildItem -LiteralPath $env:TEMP -Filter 'PsyCoLab-launch-*.exe.log' | ForEach-Object { Write-Output $_.FullName; Get-Content -LiteralPath $_.FullName -Tail 15 }
      - name: Check portability
        run: python scripts/portability_check.py

  # Keep the original required status context after splitting the full Windows
  # job into four parallel shards. Branch protection still expects exactly
  # "test (windows-latest)"; this gate must fail if *any* dependency fails,
  # is cancelled or skipped. Do not silently waive a scientific test.
  required-windows-check:
    name: test (windows-latest)
    runs-on: windows-latest
    needs: [scientist-first-smoke, test]
    if: ${{ always() }}
    steps:
      - name: Verify scientific smoke and all Windows test shards passed
        shell: pwsh
        env:
          SMOKE_RESULT: ${{ needs.scientist-first-smoke.result }}
          SHARDS_RESULT: ${{ needs.test.result }}
        run: |
          if ($env:SMOKE_RESULT -ne 'success' -or $env:SHARDS_RESULT -ne 'success') {
            throw "Required validation did not pass. Scientific smoke: $env:SMOKE_RESULT; Windows shards: $env:SHARDS_RESULT"
          }
          Write-Host "All scientific smoke and four Windows test shards passed."
