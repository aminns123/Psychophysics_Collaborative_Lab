name: Headless checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only the latest commit on a repair PR needs an expensive full Windows run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run headless tests
        run: python -m pytest
      - name: Check portability
        run: python scripts/portability_check.py
